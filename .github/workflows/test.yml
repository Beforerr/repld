name: Test

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: write # julia-actions/cache deletes superseded caches
      contents: read
    env:
      JULIA_CPU_TARGET: ${{ matrix.os == 'macos-latest' && 'native' || 'x86-64-v3' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.25'
          cache-dependency-path: go.sum
      - uses: julia-actions/setup-julia@v2
      - uses: julia-actions/cache@v3
      # Not setup-r: it adds R CMD check extras (Linux sysreqs, macOS Fortran, Windows Ghostscript)
      - if: runner.os == 'Linux'
        run: |
          install() { sudo apt-get install -y -qq --no-install-recommends r-base-core; }
          install || { sudo apt-get update -qq && install; }
      - if: runner.os == 'macOS'
        run: |
          curl -fsSLo "$RUNNER_TEMP/R.pkg" "$(curl -fsSL "https://api.r-hub.io/rversions/resolve/release/macos/$(uname -m)" | jq -r .url)"
          sudo installer -pkg "$RUNNER_TEMP/R.pkg" -target /
      # windows-latest ships R.
      - if: runner.os == 'Windows'
        shell: bash
        run: cygpath -w "$(ls -d /c/Program\ Files/R/R-*/bin | tail -1)" >> "$GITHUB_PATH"
      - run: julia -e 'using Pkg; Pkg.add("Revise")'
      - shell: bash
        run: go test -C go -v -coverprofile=coverage.out -covermode=atomic
      - name: Coverage summary
        shell: bash
        run: |
          {
            echo '### Go coverage'
            echo '```'
            go tool cover -func=go/coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=go/coverage.out | tail -n1
      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          files: go/coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
